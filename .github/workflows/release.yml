name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bgt-release.jks
          echo "storeFile=../bgt-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Set version env
        run: |
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BGT-${{ steps.version.outputs.VERSION }}.apk

      - name: Compute SHA-256
        id: sha
        run: |
          HASH=$(sha256sum app/build/outputs/apk/release/BGT-${{ steps.version.outputs.VERSION }}.apk | cut -d' ' -f1)
          echo "HASH=$HASH" >> $GITHUB_OUTPUT

      - name: Build release notes
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          echo "## BGT $VERSION" > release_notes.md
          echo "" >> release_notes.md
          if [ -f CHANGELOG.md ]; then
            awk -v ver="## $VERSION" '$0 ~ "^"ver{flag=1; next} /^## v/{flag=0} flag' CHANGELOG.md >> release_notes.md || true
          fi
          echo "" >> release_notes.md
          echo "Descarga el APK y abre el archivo en tu Android para instalar." >> release_notes.md
          echo "" >> release_notes.md
          echo "> Necesitas tener activada la opción **\"Instalar apps de fuentes desconocidas\"** en Ajustes." >> release_notes.md
          echo "" >> release_notes.md
          echo "**SHA-256:** \`${{ steps.sha.outputs.HASH }}\`" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "BGT ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.md
          files: app/build/outputs/apk/release/BGT-${{ steps.version.outputs.VERSION }}.apk
