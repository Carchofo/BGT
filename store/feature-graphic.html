<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1024px; height: 500px; overflow: hidden; background: #0E1B2E; font-family: "Segoe UI", system-ui, sans-serif; }

.bg {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #0E1B2E 0%, #152640 60%, #1A3050 100%);
  position: relative;
  display: flex;
  align-items: center;
  padding: 0 72px;
  gap: 60px;
}

/* Decorative gear rings */
.ring {
  position: absolute;
  border-radius: 50%;
  border: 2px solid rgba(243,130,34,.08);
}
.ring1 { width: 520px; height: 520px; right: 180px; top: -110px; }
.ring2 { width: 340px; height: 340px; right: 260px; top: -30px; }
.ring3 { width: 180px; height: 180px; right: 340px; top: 50px; }

/* Orange accent line */
.accent-line {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 5px;
  background: linear-gradient(180deg, #F38222 0%, #C9681A 100%);
}

/* LEFT — text */
.left { flex: 1; }

.eyebrow {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: #F38222;
  margin-bottom: 18px;
}

.title {
  font-size: 68px;
  font-weight: 900;
  color: #FFFFFF;
  line-height: .95;
  margin-bottom: 20px;
  letter-spacing: -.02em;
}

.title span { color: #F38222; }

.tagline {
  font-size: 18px;
  color: #8DAAC8;
  line-height: 1.5;
  max-width: 400px;
  margin-bottom: 36px;
}

.pills { display: flex; gap: 10px; flex-wrap: wrap; }
.pill {
  background: rgba(243,130,34,.12);
  border: 1px solid rgba(243,130,34,.3);
  color: #F38222;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 4px;
}
.pill.gray {
  background: rgba(141,170,200,.08);
  border-color: rgba(141,170,200,.2);
  color: #8DAAC8;
}

/* RIGHT — icon */
.right {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.icon-wrap {
  width: 200px;
  height: 200px;
  border-radius: 36px;
  background: rgba(255,255,255,.04);
  border: 1.5px solid rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 32px 80px rgba(0,0,0,.5);
}

.icon-wrap img { width: 160px; height: 160px; }

.free-badge {
  background: rgba(52,201,138,.1);
  border: 1px solid rgba(52,201,138,.3);
  color: #34C98A;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 6px 18px;
  border-radius: 4px;
}
</style>
</head>
<body>
<div class="bg">
  <div class="accent-line"></div>
  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>

  <div class="left">
    <div class="eyebrow">Board Game Tools</div>
    <div class="title">BGT<br><span>Solo</span><br>Assistant</div>
    <div class="tagline">Automas, bot opponents, and score tracking for solo board gaming. No ads. No subscriptions.</div>
    <div class="pills">
      <div class="pill">Maracaibo</div>
      <div class="pill">Tiletum</div>
      <div class="pill">Cascadia</div>
      <div class="pill">Coimbra</div>
      <div class="pill gray">+ más juegos</div>
    </div>
  </div>
